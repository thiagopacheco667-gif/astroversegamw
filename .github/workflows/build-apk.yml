name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Localizar projeto (aceita o .zip enviado direto)
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d proj
            echo "PROJ=$(dirname "$(find proj -name settings.gradle | head -1)")" >> "$GITHUB_ENV"
          else
            echo "PROJ=." >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Versão do app
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=10.7.2.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Keystore própria (opcional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: cd "$PROJ" && gradle --no-daemon assembleRelease

      - name: Nomear o arquivo
        run: |
          mkdir -p dist
          cp "$PROJ/app/build/outputs/apk/release/app-release.apk" dist/IronFront.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IronFront-apk
          path: dist/IronFront.apk

      - name: Publicar release "latest"
        if: ${{ github.ref_type == 'branch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Iron Front (último build)
          body: "APK mais recente, gerado automaticamente. Baixe IronFront.apk no celular e instale."
          files: dist/IronFront.apk
          make_latest: true

      - name: Publicar release da tag
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IronFront.apk
